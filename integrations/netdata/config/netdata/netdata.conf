# netdata.conf — local overrides.
#
# Merged with /usr/lib/netdata/conf.d/netdata.conf (stock defaults) at
# startup. Only entries that deviate from the stock default need to live
# here. The default stock netdata.conf is ~1000 lines; putting it all here
# would make upgrades painful.

[web]
    # Kill the HTTP listener entirely. Netdata still runs internally —
    # metrics collection, health evaluation, and custom_sender → dispatch
    # continue to work — but there is no dashboard or API endpoint exposed
    # on any interface. Change to `static-threaded` to re-enable, optionally
    # paired with `bind to = 127.0.0.1` for a localhost-only dashboard.
    mode = none

[db]
    # We don't consume historical netdata data — alerts evaluate against
    # the live stream and dispatch via custom_sender. Persisting tiered
    # dbengine to /var/cache/netdata adds up to hundreds of MB per host
    # over time (observed 915MB on monitored VMs) for data nothing
    # reads. Switch to in-memory mode: a 1-hour rolling window in RAM
    # is more than enough for any alarm lookback, and disk usage stays
    # near zero.
    mode = ram
    retention = 3600
