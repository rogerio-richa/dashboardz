# ram.conf — override of upstream src/health/health.d/ram.conf.
#
# Only diff from stock: oom_kill's `to:` flipped from `silent` to `sysadmin`
# so OOM events page the sysadmin role. Stock ram_in_use (WARN>90/CRIT>98)
# and ram_available are kept as-is.

      alarm: ram_in_use
         on: system.ram
      class: Utilization
       type: System
  component: Memory
host labels: _os=linux
       calc: $used * 100 / ($used + $cached + $free + $buffers)
      units: %
      every: 10s
       warn: $this > (($status >= $WARNING)  ? (80) : (90))
       crit: $this > (($status == $CRITICAL) ? (90) : (98))
      delay: down 15m multiplier 1.5 max 1h
    summary: System memory utilization
       info: System memory utilization
         to: sysadmin

      alarm: ram_available
         on: mem.available
      class: Utilization
       type: System
  component: Memory
host labels: _os=linux
       calc: $avail * 100 / ($system.ram.used + $system.ram.cached + $system.ram.free + $system.ram.buffers)
      units: %
      every: 10s
       warn: $this < (($status >= $WARNING)  ? (15) : (10))
      delay: down 15m multiplier 1.5 max 1h
    summary: System available memory
       info: Percentage of estimated amount of RAM available for userspace processes, without causing swapping
         to: silent

      alarm: oom_kill
         on: mem.oom_kill
host labels: _os=linux
     lookup: sum -30m unaligned
      units: kills
      every: 5m
       warn: $this > 0
      delay: down 10m
    summary: System OOM kills
       info: Number of out of memory kills in the last 30 minutes
         to: sysadmin
