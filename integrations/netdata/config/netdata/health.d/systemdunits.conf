# systemdunits.conf — alert on any failed systemd service unit.
#
# Driven by context `systemd.service_unit_state` from the go.d systemdunits
# collector. Netdata instantiates this template once per matching chart —
# i.e., once per discovered service unit. Each instance evaluates the
# `failed` dimension of ONE unit, which is binary (1 if the unit is in
# failed state right now, 0 otherwise). So a single `crit` threshold at
# >= 1 is correct; a separate `warn` makes no sense here.

 template: systemd_unit_failed
       on: systemd.service_unit_state
    class: Errors
     type: System
component: Systemd
   lookup: max -1m unaligned of failed
    units: 0/1
    every: 30s
     crit: $this >= 1
    delay: down 5m multiplier 1.5 max 1h
  summary: Systemd unit failed
     info: This systemd unit is in the failed state
       to: sysadmin
