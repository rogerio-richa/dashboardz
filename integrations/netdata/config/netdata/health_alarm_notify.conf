# health_alarm_notify.conf — routes all Netdata alerts to our generic dispatcher.
#
# This file is installed to /etc/netdata/health_alarm_notify.conf. Netdata's
# alarm-notify.sh sources it for every alert transition — no netdata restart
# needed to pick up an edit here, it's re-read per notification. We only
# enable the `custom` method; all other backends stay off. The dispatcher
# picks the real delivery backend from DISPATCH_BACKEND in
# /opt/netdata-dashboardz/etc/netdata-dispatch.env.

SEND_CUSTOM="YES"
DEFAULT_RECIPIENT_CUSTOM="sysadmin"

# No severity filter: CLEAR now flows to dispatch same as CRITICAL/WARNING.
# It has to, for bin/backends/dashboardz.sh's CLEAR->--resolve path to ever
# fire. Backends that don't want CLEAR noise (Telegram, historically, to
# avoid resolve-spam) filter it themselves — see FANOUT_SKIP_CLEAR in
# bin/backends/fanout.sh / env/netdata-dispatch.env.example — rather than
# it being dropped here before any backend gets a say.
role_recipients_custom[sysadmin]="sysadmin"

# custom_sender is the hook alarm-notify.sh calls for each transition routed
# to the `custom` method. The ${...} variables below are populated by
# alarm-notify.sh before sourcing this file — they are Netdata's contract, not
# ours. ${status} is the canonical severity (CRITICAL/WARNING/CLEAR/UNDEFINED).
custom_sender() {
    /opt/netdata-dashboardz/bin/netdata-dispatch.sh \
        --source     netdata \
        --host       "${host}" \
        --alarm      "${name}" \
        --chart      "${chart}" \
        --status     "${status}" \
        --old-status "${old_status}" \
        --value      "${value}" \
        --info       "${info}" \
        --when       "${when}"
}
